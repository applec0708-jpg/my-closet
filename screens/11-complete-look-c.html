<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete the look (C) · My Closet</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/icons.js" defer></script>
<script src="../design-system/avatar.js" defer></script>
<script src="../prototype-data.js" defer></script>
<script src="../prototype.js" defer></script>
</head>
<body data-page="">
<div class="stage">
<div class="phone">
  <div class="status-bar"><span>9:41</span><span class="status-bar__right"><span class="status-bar__signal"><i></i><i></i><i></i><i></i></span><span class="status-bar__battery"></span></span></div>
  <header class="nav-bar"><a class="icon-button" href="09-board-pins.html" aria-label="Back"><i class="icon " data-icon="back"></i></a><div class="nav-bar__title"><span class="t-heading-xs">Complete the look</span></div><button class="icon-button" aria-label="Share"><i class="icon " data-icon="share"></i></button></header>
  <main class="screen-body">
    <div style="padding: 0 var(--sema-space-400)">
      <div class="segmented" role="tablist"><button class="segmented__item" data-view="pin">Inspo pin</button><button class="segmented__item is-selected" data-view="you">On you</button></div>
      <div id="view-you" class="avatar-frame" style="margin-top: var(--sema-space-300); aspect-ratio: var(--shape-short)"><div class="avatar" data-me data-skin="9" data-hair="long" data-hair-color="espresso" data-body="straight" data-outfit="top:zipjacket:#c9c9c4; bottom:jeans:#a7b9cc; shoes:boots:black" aria-label="Ava wearing the recreated look"></div></div>
      <div id="view-pin" hidden style="margin-top: var(--sema-space-300)"><div class="ph ph--bleed shape-short"><img class="photo" src="../images/inspo-plaid-bomber-light-denim.jpg" alt="" onerror="this.remove()">Inspo: Plaid bomber &amp; light denim</div></div>
      <div class="t-heading-md" style="margin-top: var(--sema-space-400)">Plaid bomber, light denim</div>
      <div class="t-body-sm t-subtle" style="margin-bottom: var(--sema-space-400)">1 of 3 pieces from your closet · 2 to shop</div>
    </div>
    <div class="masonry"><div class="pin"><div class="pin__media"><div class="ph ph--cutout shape-top"><img class="photo" src="../images/black-buckle-boots.png" alt="" onerror="this.remove()">Black buckle boots</div></div><div class="pin__note"><i class="icon " data-icon="check"></i>Yours</div></div><a class="pin" href="#"><div class="pin__media"><div class="ph ph--cutout shape-short"><img class="photo" src="../images/gray-plaid-zip-jacket.png" alt="" onerror="this.remove()">Gray plaid zip jacket</div></div><div class="pin__title">Gray plaid zip jacket</div><div class="pin__meta">Depop</div></a><a class="pin" href="#"><div class="pin__media"><div class="ph ph--cutout shape-long"><img class="photo" src="../images/light-wash-baggy-jeans.png" alt="" onerror="this.remove()">Light-wash baggy jeans</div></div><div class="pin__title">Light-wash baggy jeans</div><div class="pin__meta">Depop</div></a></div>
  </main>
  <div class="screen-footer"><div class="row"><a class="button button--gray" href="08-pick-board.html">Try another pin</a><a class="button button--red" href="12-save-sheet.html">Save look</a></div></div>
  <div class="home-indicator"></div>
</div>
</div>
<script>/* Switch between the pin and you wearing it. */
document.querySelectorAll('.segmented__item').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.segmented__item').forEach(function (x) { x.classList.toggle('is-selected', x === b); });
    document.getElementById('view-pin').hidden = b.dataset.view !== 'pin';
    document.getElementById('view-you').hidden = b.dataset.view !== 'you';
  });
});</script>
</body>
</html>
